<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Life Decision Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                900: '#0c4a6e',
              },
              accent: {
                500: '#8b5cf6',
                600: '#7c3aed',
              }
            },
            animation: {
              'gradient-x': 'gradient-x 15s ease infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              'gradient-x': {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center',
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center',
                },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: #ffffff;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      /* PRINT STYLES - Ensures PDF/Print looks professional */
      @media print {
        body {
          background-color: white !important;
          color: black !important;
        }
        #root {
          padding: 0;
          margin: 0;
        }
        /* Hide non-printable elements */
        header, footer, button, .fixed, .no-print, .print\:hidden {
          display: none !important;
        }
        /* Reset Colors for Ink Saving */
        .text-white, .text-gray-300, .text-gray-400, .text-gray-500 {
          color: #000000 !important;
        }
        .text-brand-400, .text-accent-300 {
          color: #2563eb !important;
        }
        /* Remove Dark Backgrounds */
        .bg-gray-900, .bg-gray-800, .bg-white\/5, .bg-white\/10 {
          background-color: transparent !important;
          border: 1px solid #ccc !important;
          border-radius: 8px !important;
        }
        /* Typography readability */
        h1, h2, h3, h4 {
          page-break-after: avoid;
          color: #000 !important;
        }
        p, li {
          page-break-inside: avoid;
        }
        /* Show URLs in print */
        a[href]::after {
          content: " (" attr(href) ")";
          font-size: 0.8rem;
          color: #666;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
